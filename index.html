<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#f4f6f8;
  --card:#fff;
  --blue:#3b82f6;
  --green:#22c55e;
  --gray:#6b7280;
  --dark:#0f172a;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  padding:100px 20px 40px 20px;
  margin:0;
  transition:.3s;
}

body.dark{
  background:#020617;
  color:white;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  max-width:800px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.1);
  position:relative;
  transition:.3s;
}

body.dark .card{
  background:var(--dark);
}

/* 🔵 أزرار أعلى الشاشة */
.top-buttons{
  position:fixed;
  top:15px;
  left:15px;
  display:flex;
  gap:12px;
  z-index:1000;
}

.circle-btn{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
  transition:.3s;
}

.circle-btn:hover{
  transform:rotate(15deg) scale(1.1);
}

body.dark .circle-btn{
  background:#1e293b;
  color:white;
}

/* صف الإدخال */
.course-inputs{
  display:none;
  flex-direction:row;
  gap:12px;
  margin-bottom:20px;
}

.course-inputs select{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:12px;
}

/* Save + Add */
.action-buttons{
  display:flex;
  gap:12px;
  margin-bottom:20px;
}

button{
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 20px rgba(0,0,0,.15);
}

button:active{
  transform:scale(.95);
}

.save{
  background:var(--blue);
  color:white;
  flex:1;
}

.add{
  background:var(--green);
  color:white;
  flex:1;
}

/* عرض المواد */
.courses{
  margin-top:10px;
}

.course{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#e5e7eb;
  border-radius:14px;
  margin-bottom:10px;
  animation:fadeIn .3s ease;
}

body.dark .course{
  background:#1e293b;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* زر الحساب */
.calculate-container{
  text-align:center;
  margin-top:30px;
}

.calc-btn{
  background:linear-gradient(45deg,#6366f1,#3b82f6);
  color:white;
  font-size:18px;
  padding:16px 50px;
  border-radius:50px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  position:relative;
  overflow:hidden;
}

.calc-btn::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(255,255,255,.4);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}

.calc-btn:active::after{
  width:300px;
  height:300px;
  opacity:1;
  transition:0s;
}

/* النتيجة */
.result{
  display:none;
  margin-top:25px;
  text-align:center;
  font-weight:bold;
}

.result span{
  font-size:42px;
  display:block;
  margin-top:10px;
}

.good{color:#22c55e}
.mid{color:#facc15}
.bad{color:#ef4444}
</style>
</head>

<body>

<!-- أزرار أعلى الشاشة -->
<div class="top-buttons">
  <button class="circle-btn" onclick="toggleDark()">🌙</button>
  <button class="circle-btn" onclick="resetAll()">⟳</button>
</div>

<h1>📘 GPA Calculator</h1>

<div class="card">

  <div class="course-inputs" id="inputs">
    <select id="grade">
      <option value="">Grade</option>
      <option>A</option><option>A-</option>
      <option>B</option><option>B-</option>
      <option>C</option><option>C-</option>
      <option>D</option><option>F</option>
    </select>

    <select id="hours">
      <option value="">Hours</option>
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
    </select>
  </div>

  <div class="action-buttons">
    <button class="save" onclick="saveCourse()">✔ Save</button>
    <button class="add" onclick="showInputs()">➕ Add Course</button>
  </div>

  <div class="courses" id="courses"></div>

  <div class="calculate-container">
    <button class="calc-btn" onclick="calculateGPA()">📊 Calculate GPA</button>
  </div>

  <div class="result" id="result"></div>

</div>

<script>
const gradeScale = {
  "A":4.00,
  "A-":3.67,
  "B":3.33,
  "B-":3.00,
  "C":2.67,
  "C-":2.33,
  "D":2.00,
  "F":0.00
};

let courses = JSON.parse(localStorage.getItem("courses")) || [];

function showInputs(){
  document.getElementById("inputs").style.display="flex";
}

function saveCourse(){
  const grade=document.getElementById("grade").value;
  const hours=Number(document.getElementById("hours").value);

  if(!grade || !hours){
    alert("Please select grade and hours");
    return;
  }

  courses.push({grade,hours});
  localStorage.setItem("courses",JSON.stringify(courses));

  document.getElementById("grade").value="";
  document.getElementById("hours").value="";

  renderCourses();
}

function renderCourses(){
  const box=document.getElementById("courses");
  box.innerHTML="";
  courses.forEach((c,i)=>{
    box.innerHTML+=`
    <div class="course">
      ${c.grade} × ${c.hours} hours
      <button onclick="removeCourse(${i})">🗑</button>
    </div>`;
  });
}

function removeCourse(i){
  courses.splice(i,1);
  localStorage.setItem("courses",JSON.stringify(courses));
  renderCourses();
}

function calculateGPA(){
  if(!courses.length){
    alert("Add courses first");
    return;
  }

  let totalPoints=0;
  let totalHours=0;

  courses.forEach(c=>{
    totalPoints+=gradeScale[c.grade]*c.hours;
    totalHours+=c.hours;
  });

  let gpa=totalPoints/totalHours;
  gpa=Math.round(gpa*100)/100;

  const r=document.getElementById("result");
  r.style.display="block";
  r.className="result "+(gpa>=3?"good":gpa>=2?"mid":"bad");
  r.innerHTML=`GPA <span>${gpa.toFixed(2)}</span>`;
}

function resetAll(){
  courses=[];
  localStorage.removeItem("courses");
  document.getElementById("courses").innerHTML="";
  document.getElementById("inputs").style.display="none";
  document.getElementById("result").style.display="none";
}

function toggleDark(){
  document.body.classList.toggle("dark");
}

renderCourses();
</script>

</body>
</html>
