<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#e5e7eb;
    text-align:center;
    transition:.3s;
}

h1{
    margin-top:20px;
}

.container{
    max-width:800px;
    margin:30px auto;
}

.course{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

input, select{
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    flex:1;
}

/* Buttons Style */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin:20px 0;
    flex-wrap:wrap;
}

.btn{
    padding:15px 30px;
    border:none;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    transition:.3s;
}

.dark-btn{background:#374151;}
.reset-btn{background:#ef4444;}
.add-btn{background:#22c55e;}
.save-btn{background:#3b82f6;}

.calculate-btn{
    margin-top:20px;
    padding:20px 80px;
    font-size:24px;
    border-radius:50px;
    border:none;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#6366f1,#8b5cf6);
    box-shadow:0 15px 35px rgba(0,0,0,0.2);
    transition:.3s;
}

.result{
    margin-top:30px;
    font-size:28px;
    font-weight:bold;
}

/* Dark Mode */

.dark{
    background:#111827;
    color:white;
}

.dark input,.dark select{
    background:#374151;
    color:white;
    border:1px solid #555;
}
</style>
</head>

<body>

<h1>GPA Calculation</h1>

<div class="container">

<div id="courses"></div>

<div class="buttons">
<button class="btn dark-btn" onclick="toggleDark()">🌙 Dark</button>
<button class="btn reset-btn" onclick="resetAll()">🔄 Reset</button>
<button class="btn add-btn" onclick="addCourse()">➕ Add</button>
<button class="btn save-btn">✔ Save</button>
</div>

<button class="calculate-btn" onclick="calculateGPA()">📊 Calculate GPA</button>

<div class="result" id="result"></div>

</div>

<script>

/* Grade Scale */

const gradePoints = {
"A":4,
"A-":3.67,
"B+":3.33,
"B":3,
"B-":2.67,
"C+":2.33,
"C":2,
"C-":1.67,
"D":1,
"F":0
};

function addCourse(){
    let div=document.createElement("div");
    div.className="course";

    div.innerHTML=`
        <input type="text" placeholder="Course Name">
        <select>
            <option>A</option>
            <option>A-</option>
            <option>B+</option>
            <option>B</option>
            <option>B-</option>
            <option>C+</option>
            <option>C</option>
            <option>C-</option>
            <option>D</option>
            <option>F</option>
        </select>
        <input type="number" placeholder="Credit Hours" min="1">
    `;

    document.getElementById("courses").appendChild(div);
}

/* Color Based On GPA */

function getColor(gpa){
    if(gpa>=3.7) return "#16a34a";     // أخضر قوي
    if(gpa>=3) return "#22c55e";       // أخضر
    if(gpa>=2) return "#f59e0b";       // برتقالي
    return "#ef4444";                  // أحمر
}

/* Letter From GPA */

function getLetter(gpa){
    if(gpa>=3.7) return "A";
    if(gpa>=3.3) return "B+";
    if(gpa>=3) return "B";
    if(gpa>=2.7) return "B-";
    if(gpa>=2.3) return "C+";
    if(gpa>=2) return "C";
    if(gpa>=1.7) return "C-";
    if(gpa>=1) return "D";
    return "F";
}

function calculateGPA(){

    let courses=document.querySelectorAll(".course");
    let totalPoints=0;
    let totalCredits=0;

    courses.forEach(course=>{
        let grade=course.querySelector("select").value;
        let credits=parseFloat(course.querySelector("input[type='number']").value);

        if(!credits) return;

        let points=gradePoints[grade]*credits;

        totalPoints+=points;
        totalCredits+=credits;
    });

    if(totalCredits===0){
        alert("Enter courses first");
        return;
    }

    let gpa=(totalPoints/totalCredits);
    let finalGPA=gpa.toFixed(2);

    let letter=getLetter(gpa);
    let color=getColor(gpa);

    let result=document.getElementById("result");
    result.innerHTML=`GPA: ${letter}`;
    result.style.color=color;
}

/* Reset */

function resetAll(){
    document.getElementById("courses").innerHTML="";
    document.getElementById("result").innerHTML="";
}

/* Dark Mode */

function toggleDark(){
    document.body.classList.toggle("dark");
}

addCourse();

</script>

</body>
</html>
