<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f3f4f6;
    transition:0.3s;
    text-align:center;
}

.container{
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    margin-bottom:20px;
}

.course{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.course input, .course select{
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
    flex:1;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.add-btn{background:#3b82f6;color:white;}
.calc-btn{background:#10b981;color:white;margin-top:10px;}
.reset-btn{background:#ef4444;color:white;}
.dark-btn{background:#111827;color:white;}

.result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.dark{
    background:#111827;
    color:white;
}

.dark .container{
    background:#1f2937;
}

.dark input, .dark select{
    background:#374151;
    color:white;
    border:1px solid #555;
}
</style>
</head>

<body>

<div class="container">
<h1>GPA Calculator</h1>

<div id="courses"></div>

<button class="add-btn" onclick="addCourse()">+ Add Course</button>
<br>
<button class="calc-btn" onclick="calculateGPA()">Calculate GPA</button>
<button class="reset-btn" onclick="resetAll()">Reset</button>
<button class="dark-btn" onclick="toggleDark()">Dark Mode</button>

<div class="result" id="result"></div>
</div>

<script>

let gradePoints = {
    "A":4,
    "B":3,
    "C":2,
    "D":1,
    "F":0
};

function addCourse(){
    let div = document.createElement("div");
    div.className="course";

    div.innerHTML=`
        <input type="text" placeholder="Course Name">
        <select>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
            <option value="F">F</option>
        </select>
        <input type="number" placeholder="Credit Hours" min="1">
    `;

    document.getElementById("courses").appendChild(div);
}

function getLetterFromGPA(gpa){
    if(gpa>=3.5) return "A";
    if(gpa>=2.5) return "B";
    if(gpa>=1.5) return "C";
    if(gpa>=1) return "D";
    return "F";
}

function getColor(gpa){
    if(gpa>=3.5) return "#16a34a";
    if(gpa>=2.5) return "#22c55e";
    if(gpa>=1.5) return "#f59e0b";
    return "#ef4444";
}

function calculateGPA(){

    let courses=document.querySelectorAll(".course");
    let totalPoints=0;
    let totalCredits=0;

    courses.forEach(course=>{
        let grade=course.querySelector("select").value;
        let credits=parseFloat(course.querySelector("input[type='number']").value);

        if(!credits) return;

        let points=gradePoints[grade]*credits;

        totalPoints+=points;
        totalCredits+=credits;
    });

    if(totalCredits===0){
        alert("Enter courses first!");
        return;
    }

    let gpa=(totalPoints/totalCredits).toFixed(2);
    let letter=getLetterFromGPA(gpa);
    let color=getColor(gpa);

    let result=document.getElementById("result");
    result.innerHTML=`GPA: ${gpa} (${letter})`;
    result.style.color=color;
}

function resetAll(){
    document.getElementById("courses").innerHTML="";
    document.getElementById("result").innerHTML="";
}

function toggleDark(){
    document.body.classList.toggle("dark");
}

addCourse();

</script>

</body>
</html>
