<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calc</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --blue:#3b82f6;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  padding:120px 20px 40px;
  transition:.4s ease;
  overflow-x:hidden;
}

body.dark{
  background:#020617;
  color:#fff;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.card{
  max-width:800px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.1);
  transition:.4s;
}

body.dark .card{
  background:#0f172a;
}

/* ===== Top Circular Buttons ===== */

.top-buttons{
  position:fixed;
  top:20px;
  left:20px;
  display:flex;
  gap:15px;
  z-index:999;
}

.circle-btn{
  width:55px;
  height:55px;
  border-radius:50%;
  border:none;
  font-size:22px;
  cursor:pointer;
  transition:.3s;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dark-btn{
  background:black;
  color:white;
}

.reset-btn{
  background:#ef4444;
  color:white;
}

.circle-btn:hover{
  transform:scale(1.1);
}

/* ===== Ripple Effect ===== */

.ripple{
  position:fixed;
  border-radius:50%;
  transform:scale(0);
  animation:ripple-effect .6s linear;
  background:rgba(255,255,255,.3);
  pointer-events:none;
}

@keyframes ripple-effect{
  to{
    transform:scale(15);
    opacity:0;
  }
}

/* ===== Course Row ===== */

.course{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

select{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  flex:1;
  min-width:120px;
}

/* ===== Buttons ===== */

.actions{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  transition:.3s;
}

.add-btn{
  background:var(--blue);
  color:white;
  flex:1;
}

.save-btn{
  background:var(--green);
  color:white;
  flex:1;
}

.calculate-btn{
  background:linear-gradient(45deg,#3b82f6,#22c55e);
  color:white;
  display:block;
  margin:30px auto 0;
  width:220px;
  font-size:18px;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 10px 20px rgba(0,0,0,.15);
}

/* ===== Result ===== */

.result{
  text-align:center;
  margin-top:25px;
  font-size:28px;
  font-weight:bold;
}

.green{color:var(--green);}
.yellow{color:var(--yellow);}
.red{color:var(--red);}

.warning{
  text-align:center;
  margin-top:15px;
  color:var(--red);
}

@media(max-width:600px){
  .course{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="top-buttons">
  <button class="circle-btn dark-btn" onclick="toggleDark()">🌙</button>
  <button class="circle-btn reset-btn" onclick="resetAll()">🔄</button>
</div>

<div class="card">
  <h1>GPA Calculator</h1>

  <div class="actions">
    <button class="add-btn" onclick="addCourse()">Add Course</button>
    <button class="save-btn" onclick="saveGPA()">Save</button>
  </div>

  <div id="courses"></div>

  <button class="calculate-btn" onclick="calculateGPA()">Calculate GPA</button>

  <div class="warning" id="warning"></div>
  <div class="result" id="result"></div>
</div>

<script>

function addCourse(){
  const div=document.createElement("div");
  div.className="course";
  div.innerHTML=`
  <select class="grade">
    <option value="">Grade</option>
    <option value="4">A</option>
    <option value="3.7">A-</option>
    <option value="3.3">B+</option>
    <option value="3">B</option>
    <option value="2.7">B-</option>
    <option value="2.3">C+</option>
    <option value="2">C</option>
    <option value="1.7">C-</option>
    <option value="1">D</option>
    <option value="0">F</option>
  </select>

  <select class="hours">
    <option value="">Hours</option>
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
    <option>5</option>
    <option>6</option>
  </select>
  `;
  document.getElementById("courses").appendChild(div);
}

function calculateGPA(){
  const grades=document.querySelectorAll(".grade");
  const hours=document.querySelectorAll(".hours");

  let totalPoints=0;
  let totalHours=0;

  for(let i=0;i<grades.length;i++){
    if(grades[i].value===""||hours[i].value===""){
      document.getElementById("warning").innerHTML="⚠ Please select grade and hours";
      return;
    }
    totalPoints+=grades[i].value*hours[i].value;
    totalHours+=parseInt(hours[i].value);
  }

  if(totalHours===0) return;

  const gpa=(totalPoints/totalHours).toFixed(2);

  const result=document.getElementById("result");
  result.innerHTML="🎓 GPA: "+gpa;
  document.getElementById("warning").innerHTML="";

  result.className="result";

  if(gpa>=3) result.classList.add("green");
  else if(gpa>=2) result.classList.add("yellow");
  else result.classList.add("red");

  localStorage.setItem("savedGPA",gpa);
}

function saveGPA(){
  alert("GPA Saved ✔");
}

function resetAll(){
  document.getElementById("courses").innerHTML="";
  document.getElementById("result").innerHTML="";
  document.getElementById("warning").innerHTML="";
  localStorage.removeItem("savedGPA");
}

function toggleDark(){
  const circle=document.createElement("span");
  circle.className="ripple";
  circle.style.left=window.innerWidth/2+"px";
  circle.style.top=window.innerHeight/2+"px";
  document.body.appendChild(circle);

  setTimeout(()=>circle.remove(),600);

  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
