<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
body{
font-family:Arial, sans-serif;
background:#dfe3ea;
text-align:center;
padding:25px;
transition:0.4s;
}

.dark{
background:#1e1e1e;
color:white;
}

.top-buttons{
display:flex;
justify-content:center;
gap:12px;
margin-bottom:30px;
flex-wrap:wrap;
}

button{
border:none;
padding:10px 18px;
border-radius:25px;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.dark-btn{background:#2f3b52;color:white;}
.reset-btn{background:#ef4444;color:white;}
.add-btn{background:#22c55e;color:white;}
.save-btn{background:#3b82f6;color:white;}

.row{
display:flex;
justify-content:center;
gap:8px;
margin:12px 0;
align-items:center;
flex-wrap:wrap;
}

input,select{
padding:8px;
border-radius:10px;
border:1px solid #ccc;
font-size:14px;
}

.row input{
width:100px;
}

.trash{
background:#ef4444;
color:white;
border-radius:50%;
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:14px;
}

.edit-btn{
background:#f59e0b;
color:white;
border-radius:50%;
width:32px;
height:32px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:14px;
}

.calculate{
margin-top:40px;
padding:18px 60px;
font-size:20px;
border-radius:40px;
background:linear-gradient(90deg,#6366f1,#8b5cf6);
color:white;
}

.result{
margin-top:25px;
font-size:22px;
font-weight:bold;
opacity:0;
transform:scale(0.9);
transition:all 0.4s ease;
}

.result.show{
opacity:1;
transform:scale(1);
}

.stats{
margin-top:10px;
font-size:14px;
opacity:0.8;
}

.prev-section{
margin-top:20px;
}

.prev-section input{
width:100px;
}
</style>
</head>

<body>

<div class="top-buttons">
<button class="dark-btn" onclick="toggleDark()">🌙 Dark</button>
<button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
<button class="add-btn" onclick="addCourse()">➕ Add</button>
<button class="save-btn" onclick="saveCourse()">✔ Save</button>
</div>

<div id="courses"></div>

<div class="prev-section">
<button onclick="togglePrev()">➕ Add Previous GPA</button>
<div id="prevInputs" style="display:none; margin-top:10px;">
<input type="number" step="0.01" id="prevGPA" placeholder="Previous GPA">
<input type="number" id="prevCredits" placeholder="Credits">
</div>
</div>

<button class="calculate" onclick="calculateGPA()">📊 Calc GPA</button>

<div class="result" id="result"></div>
<div class="stats" id="stats"></div>

<script>

let coursesDiv = document.getElementById("courses");
let addUsed = false;

function createRow(){
let row = document.createElement("div");
row.className="row editing";

row.innerHTML=`
<input type="text" placeholder="NAME (Optional)">
<select>
<option value="" disabled selected>Grades</option>
<option value="4">A</option>
<option value="3.67">A-</option>
<option value="3.33">B</option>
<option value="3">B-</option>
<option value="2.67">C</option>
<option value="2.33">C-</option>
<option value="2">D</option>
<option value="0">F</option>
</select>
<select>
<option value="" disabled selected>Credits</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>
<div class="trash" onclick="this.parentElement.remove()">🗑</div>
`;

coursesDiv.appendChild(row);
}

function addCourse(){
if(!addUsed){
createRow();
addUsed = true;
}
}

function saveCourse(){
let editingRow = document.querySelector(".editing");
if(!editingRow) return;

editingRow.classList.remove("editing");

editingRow.querySelectorAll("input,select").forEach(el=>{
el.disabled = true;
});

let editBtn = document.createElement("div");
editBtn.className="edit-btn";
editBtn.innerHTML="✏";
editBtn.onclick=function(){
editingRow.querySelectorAll("input,select").forEach(el=>{
el.disabled = false;
});
editingRow.classList.add("editing");
editBtn.remove();
};
editingRow.appendChild(editBtn);

createRow();
}

function calculateGPA(){

let rows=document.querySelectorAll(".row");
let totalPoints=0;
let totalCredits=0;
let courseCount=0;

for(let row of rows){

let selects=row.querySelectorAll("select");
if(selects.length<2) continue;

if(selects[0].value==="" || selects[1].value===""){
alert("Please complete all Grades and Credits before calculating.");
return;
}

let grade=parseFloat(selects[0].value);
let credits=parseInt(selects[1].value);

totalPoints+=grade*credits;
totalCredits+=credits;
courseCount++;
}

let prevGPA=document.getElementById("prevGPA").value;
let prevCredits=document.getElementById("prevCredits").value;

if(prevGPA && prevCredits){
totalPoints+=parseFloat(prevGPA)*parseInt(prevCredits);
totalCredits+=parseInt(prevCredits);
}

if(totalCredits===0){
alert("No courses added.");
return;
}

let gpa=(totalPoints/totalCredits).toFixed(2);
let numericGPA=parseFloat(gpa);

let letter="";
if(numericGPA >= 3.7) letter="A";
else if(numericGPA >= 3.33) letter="A-";
else if(numericGPA >= 3) letter="B";
else if(numericGPA >= 2.67) letter="B-";
else if(numericGPA >= 2.33) letter="C";
else if(numericGPA >= 2) letter="C-";
else if(numericGPA >= 1) letter="D";
else letter="F";

let resultDiv=document.getElementById("result");
resultDiv.innerHTML=`GPA: ${gpa} (${letter})`;
resultDiv.classList.remove("show");
void resultDiv.offsetWidth;
resultDiv.classList.add("show");

if(numericGPA>=3.7) resultDiv.style.color="green";
else if(numericGPA>=2.33) resultDiv.style.color="orange";
else resultDiv.style.color="red";

document.getElementById("stats").innerHTML=
`Total Courses: ${courseCount} | Total Credits: ${totalCredits}`;
}

function togglePrev(){
let box=document.getElementById("prevInputs");
box.style.display = box.style.display==="none" ? "block" : "none";
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function resetAll(){
coursesDiv.innerHTML="";
document.getElementById("result").innerText="";
document.getElementById("stats").innerText="";
addUsed=false;
}

</script>

</body>
</html>
