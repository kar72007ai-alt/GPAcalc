<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
body{
font-family:Arial, sans-serif;
background:#dfe3ea;
text-align:center;
padding:40px;
transition:0.4s;
}

.dark{
background:#1e1e1e;
color:white;
}

.top-buttons{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:40px;
flex-wrap:wrap;
}

button{
border:none;
padding:14px 30px;
border-radius:30px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.dark-btn{background:#2f3b52;color:white;}
.reset-btn{background:#ef4444;color:white;}
.add-btn{background:#22c55e;color:white;}
.save-btn{background:#3b82f6;color:white;}

.row{
display:flex;
justify-content:center;
gap:10px;
margin:15px 0;
align-items:center;
}

input,select{
padding:10px;
border-radius:12px;
border:1px solid #ccc;
font-size:16px;
}

.label{
font-weight:bold;
margin-right:5px;
}

.trash{
background:#ef4444;
color:white;
border-radius:50%;
width:40px;
height:40px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.calculate{
margin-top:50px;
padding:22px 70px;
font-size:24px;
border-radius:50px;
background:linear-gradient(90deg,#6366f1,#8b5cf6);
color:white;
}

.result{
margin-top:30px;
font-size:26px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="top-buttons">
<button class="dark-btn" onclick="toggleDark()">🌙 Dark</button>
<button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
<button class="add-btn" onclick="addCourse()">➕ Add</button>
<button class="save-btn" onclick="saveData()">✔ Save</button>
</div>

<div id="courses"></div>

<button class="calculate" onclick="calculateGPA()">📊 Calculate GPA</button>

<div class="result" id="result"></div>

<script>

let coursesDiv = document.getElementById("courses");

function createRow(){
let row = document.createElement("div");
row.className="row";

row.innerHTML=`
<input type="text" placeholder="Course Name (Optional)">
<span class="label">Grades</span>
<select>
<option value="4">A</option>
<option value="3">B</option>
<option value="2">C</option>
<option value="1">D</option>
<option value="0">F</option>
</select>
<span class="label">Credits</span>
<select>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
</select>
<div class="trash" onclick="this.parentElement.remove()">🗑</div>
`;

coursesDiv.appendChild(row);
}

function addCourse(){
createRow();
}

function calculateGPA(){
let rows=document.querySelectorAll(".row");
let totalPoints=0;
let totalCredits=0;

rows.forEach(row=>{
let grade=row.querySelectorAll("select")[0].value;
let credits=row.querySelectorAll("select")[1].value;

totalPoints+=grade*credits;
totalCredits+=parseInt(credits);
});

if(totalCredits===0){
document.getElementById("result").innerText="No courses added";
return;
}

let gpa=(totalPoints/totalCredits).toFixed(2);

let letter="";
if(gpa>=3.7) letter="A";
else if(gpa>=3) letter="B";
else if(gpa>=2) letter="C";
else if(gpa>=1) letter="D";
else letter="F";

let resultDiv=document.getElementById("result");
resultDiv.innerHTML=`GPA: ${gpa} (${letter})`;

if(gpa>=3.5) resultDiv.style.color="green";
else if(gpa>=2) resultDiv.style.color="orange";
else resultDiv.style.color="red";
}

function toggleDark(){
document.body.classList.toggle("dark");
}

function resetAll(){
coursesDiv.innerHTML="";
document.getElementById("result").innerText="";
}

function saveData(){
localStorage.setItem("savedCourses",coursesDiv.innerHTML);
alert("Saved successfully");
}

window.onload=function(){
let saved=localStorage.getItem("savedCourses");
if(saved){
coursesDiv.innerHTML=saved;
}
}
</script>

</body>
</html>
