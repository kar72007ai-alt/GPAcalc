<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#111827;
  --primary:#6366f1;
}

.dark{
  --bg:#111827;
  --card:#1f2937;
  --text:#f9fafb;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:100px 20px 40px 20px;
  transition:0.3s;
}

/* Top Buttons */
.top-buttons{
  position:fixed;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  z-index:1000;
}

.circle-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  background:var(--card);
  color:var(--text);
  box-shadow:0 5px 15px rgba(0,0,0,.2);
  transition:all .3s ease;
}

.circle-btn:hover{
  transform:rotate(15deg) scale(1.1);
}

/* Card */
.card{
  max-width:600px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
  transition:0.3s;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

/* Buttons */
button{
  border:none;
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:all .25s ease;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

button:active{
  transform:scale(.96);
}

/* Add + Save */
.action-buttons{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.add-btn{
  background:#10b981;
  color:white;
  flex:1;
}

.save-btn{
  background:#3b82f6;
  color:white;
  flex:1;
}

/* Courses */
.course{
  display:flex;
  gap:10px;
  margin-bottom:10px;
  animation:fadeIn .3s ease;
}

select{
  flex:1;
  padding:8px;
  border-radius:8px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* Calculate Button */
.calc-container{
  text-align:center;
  margin-top:30px;
}

.calc-btn{
  background:linear-gradient(45deg,#6366f1,#3b82f6);
  color:white;
  font-size:18px;
  padding:16px 40px;
  border-radius:50px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  position:relative;
  overflow:hidden;
}

.calc-btn::after{
  content:"";
  position:absolute;
  width:0;
  height:0;
  background:rgba(255,255,255,.4);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
}

.calc-btn:active::after{
  width:300px;
  height:300px;
  opacity:1;
  transition:0s;
}

.result{
  margin-top:20px;
  font-size:20px;
  font-weight:bold;
  text-align:center;
}
</style>
</head>

<body>

<div class="top-buttons">
  <button class="circle-btn" onclick="toggleDark()">🌙</button>
  <button class="circle-btn" onclick="resetAll()">⟳</button>
</div>

<div class="card">
  <h1>GPA Calculator</h1>

  <div class="action-buttons">
    <button class="add-btn" onclick="addCourse()">Add Course</button>
    <button class="save-btn" onclick="saveGPA()">Save</button>
  </div>

  <div id="courses"></div>

  <div class="calc-container">
    <button class="calc-btn" onclick="calculateGPA()">Calculate GPA</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
const gradePoints = {
  "A+":4,"A":4,"A-":3.7,
  "B+":3.3,"B":3,"B-":2.7,
  "C+":2.3,"C":2,"C-":1.7,
  "D+":1.3,"D":1,"F":0
};

function addCourse(){
  const courseDiv = document.createElement("div");
  courseDiv.className="course";

  const gradeSelect = document.createElement("select");
  for(let grade in gradePoints){
    gradeSelect.innerHTML += `<option value="${grade}">${grade}</option>`;
  }

  const hourSelect = document.createElement("select");
  for(let i=1;i<=6;i++){
    hourSelect.innerHTML += `<option value="${i}">${i} hours</option>`;
  }

  courseDiv.appendChild(gradeSelect);
  courseDiv.appendChild(hourSelect);
  document.getElementById("courses").appendChild(courseDiv);
}

function calculateGPA(){
  const courses = document.querySelectorAll(".course");
  let totalPoints=0;
  let totalHours=0;

  courses.forEach(course=>{
    const grade = course.children[0].value;
    const hours = parseInt(course.children[1].value);
    totalPoints += gradePoints[grade]*hours;
    totalHours += hours;
  });

  if(totalHours===0){
    document.getElementById("result").innerText="Please add courses";
    return;
  }

  const gpa = (totalPoints/totalHours).toFixed(2);
  document.getElementById("result").innerText="Your GPA: "+gpa;
  localStorage.setItem("savedGPA", gpa);
}

function saveGPA(){
  alert("GPA Saved ✅");
}

function resetAll(){
  document.getElementById("courses").innerHTML="";
  document.getElementById("result").innerText="";
  localStorage.removeItem("savedGPA");
}

function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
