<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#f4f6f8;
  --card:#fff;
  --blue:#3b82f6;
  --green:#22c55e;
  --gray:#6b7280;
  --dark:#0f172a;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  padding:20px;
  margin:0;
}
body.dark{background:#020617;color:white}

h1{text-align:center;margin-bottom:20px}

.card{
  max-width:800px;
  margin:auto;
  background:var(--card);
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
body.dark .card{background:var(--dark)}

.course-inputs{
  display:none;
  flex-direction:row;
  gap:10px;
  margin-bottom:12px;
}

.course-inputs select{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:10px;
}

button{
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.save{background:var(--blue);color:white;width:100%}
.add{background:var(--green);color:white}
.calc{background:var(--blue);color:white}
.reset{background:var(--gray);color:white}
.darkbtn{background:#020617;color:white}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}

.courses{margin-top:15px}
.course{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#e5e7eb;
  border-radius:10px;
  margin-bottom:8px;
}
body.dark .course{background:#1e293b}

.result{
  display:none;
  margin-top:25px;
  text-align:center;
  font-weight:bold;
}
.result span{font-size:42px;display:block;margin-top:8px}
.good{color:#22c55e}
.mid{color:#facc15}
.bad{color:#ef4444}
</style>
</head>

<body>

<h1>📘 GPA Calculator</h1>

<div class="card">

  <div class="course-inputs" id="inputs">
    <select id="grade">
      <option value="">Grade</option>
      <option>A</option>
      <option>A-</option>
      <option>B</option>
      <option>B-</option>
      <option>C</option>
      <option>C-</option>
      <option>D</option>
      <option>F</option>
    </select>

    <select id="hours">
      <option value="">Hours</option>
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
    </select>
  </div>

  <button class="save" onclick="saveCourse()">✔ Save Course</button>

  <div class="courses" id="courses"></div>

  <div class="buttons">
    <button class="add" onclick="showInputs()">➕ Add Course</button>
    <button class="calc" onclick="calculateGPA()">📊 Calculate</button>
    <button class="reset" onclick="resetAll()">🔄 Reset</button>
    <button class="darkbtn" onclick="toggleDark()">🌙 Dark</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>

/* ✅ Grade Scale مطابق للصورة */
const gradeScale = {
  "A": 4.00,
  "A-": 3.67,
  "B": 3.33,
  "B-": 3.00,
  "C": 2.67,
  "C-": 2.33,
  "D": 2.00,
  "F": 0.00
};

let courses = JSON.parse(localStorage.getItem("courses")) || [];

/* إظهار المدخلات */
function showInputs(){
 document.getElementById("inputs").style.display="flex";
}

/* حفظ مادة */
function saveCourse(){
 const grade=document.getElementById("grade").value;
 const hours=Number(document.getElementById("hours").value);

 if(!grade || !hours){
   alert("Please select grade and hours");
   return;
 }

 courses.push({grade, hours});
 localStorage.setItem("courses",JSON.stringify(courses));

 document.getElementById("grade").value="";
 document.getElementById("hours").value="";

 renderCourses();
}

/* عرض المواد */
function renderCourses(){
 const box=document.getElementById("courses");
 box.innerHTML="";
 courses.forEach((c,i)=>{
   box.innerHTML+=`
    <div class="course">
      ${c.grade} × ${c.hours} hours
      <button onclick="removeCourse(${i})">🗑</button>
    </div>`;
 });
}

/* حذف مادة */
function removeCourse(i){
 courses.splice(i,1);
 localStorage.setItem("courses",JSON.stringify(courses));
 renderCourses();
}

/* 🧮 الحساب الصحيح النهائي */
function calculateGPA(){
 if(!courses.length){
   alert("Add courses first");
   return;
 }

 let totalQualityPoints = 0;
 let totalCreditHours = 0;

 courses.forEach(course=>{
   const gradePoint = gradeScale[course.grade];
   const qualityPoints = gradePoint * course.hours;

   totalQualityPoints += qualityPoints;
   totalCreditHours += course.hours;
 });

 let gpa = totalQualityPoints / totalCreditHours;

 // 🔥 حل مشكلة التقريب العشري نهائيًا
 gpa = Math.round(gpa * 100) / 100;

 const r=document.getElementById("result");
 r.style.display="block";
 r.className="result "+(gpa>=3?"good":gpa>=2?"mid":"bad");
 r.innerHTML=`GPA <span>${gpa.toFixed(2)}</span>`;
}

/* إعادة تعيين */
function resetAll(){
 courses=[];
 localStorage.removeItem("courses");
 document.getElementById("courses").innerHTML="";
 document.getElementById("inputs").style.display="none";
 document.getElementById("result").style.display="none";
}

/* دارك مود */
function toggleDark(){
 document.body.classList.toggle("dark");
}

/* تحميل المواد المحفوظة */
renderCourses();

</script>

</body>
</html>
