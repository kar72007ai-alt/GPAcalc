<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#f4f6f8;
  --card:#fff;
  --blue:#3b82f6;
  --green:#22c55e;
  --gray:#6b7280;
  --dark:#0f172a;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  padding:20px;
  margin:0;
}
body.dark{background:#020617;color:white}

h1{text-align:center;margin-bottom:20px}

.card{
  max-width:800px;
  margin:auto;
  background:var(--card);
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.1);
  position:relative;
}
body.dark .card{background:var(--dark)}

/* 🔵 أزرار أعلى الشمال */
.top-buttons{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
}

.circle-btn{
  width:45px;
  height:45px;
  border-radius:50%;
  border:none;
  font-size:18px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.reset-btn{background:#ef4444;color:white;}
.dark-btn{background:#111827;color:white;}

/* صف الإدخال */
.course-inputs{
  display:none;
  flex-direction:row;
  gap:10px;
  margin-bottom:15px;
}

.course-inputs select{
  flex:1;
  padding:12px;
  font-size:16px;
  border-radius:10px;
}

/* أزرار Save + Add */
.action-buttons{
  display:flex;
  gap:12px;
  margin-bottom:15px;
}

button{
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.save{background:var(--blue);color:white;flex:1;}
.add{background:var(--green);color:white;flex:1;}

/* عرض المواد */
.courses{margin-top:10px}

.course{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#e5e7eb;
  border-radius:12px;
  margin-bottom:8px;
}
body.dark .course{background:#1e293b}

/* زر الحساب */
.calculate-container{
  text-align:center;
  margin-top:25px;
}

.calc-btn{
  background:linear-gradient(45deg,#6366f1,#3b82f6);
  color:white;
  font-size:18px;
  padding:16px 40px;
  border-radius:50px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

.result{
  display:none;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
}

.result span{
  font-size:42px;
  display:block;
  margin-top:8px;
}

.good{color:#22c55e}
.mid{color:#facc15}
.bad{color:#ef4444}
</style>
</head>

<body>

<h1>📘 GPA Calculator</h1>

<div class="card">

  <!-- 🔵 أزرار أعلى الشمال -->
  <div class="top-buttons">
    <button class="circle-btn reset-btn" onclick="resetAll()">⟳</button>
    <button class="circle-btn dark-btn" onclick="toggleDark()">🌙</button>
  </div>

  <!-- إدخال -->
  <div class="course-inputs" id="inputs">
    <select id="grade">
      <option value="">Grade</option>
      <option>A</option><option>A-</option>
      <option>B</option><option>B-</option>
      <option>C</option><option>C-</option>
      <option>D</option><option>F</option>
    </select>

    <select id="hours">
      <option value="">Hours</option>
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option><option>6</option>
    </select>
  </div>

  <!-- 🟢 Save + Add -->
  <div class="action-buttons">
    <button class="save" onclick="saveCourse()">✔ Save</button>
    <button class="add" onclick="showInputs()">➕ Add Course</button>
  </div>

  <div class="courses" id="courses"></div>

  <!-- 🟣 زر الحساب -->
  <div class="calculate-container">
    <button class="calc-btn" onclick="calculateGPA()">📊 Calculate GPA</button>
  </div>

  <div class="result" id="result"></div>

</div>

<script>
const gradeScale = {
  "A":4.00,
  "A-":3.67,
  "B":3.33,
  "B-":3.00,
  "C":2.67,
  "C-":2.33,
  "D":2.00,
  "F":0.00
};

let courses = JSON.parse(localStorage.getItem("courses")) || [];

function showInputs(){
 document.getElementById("inputs").style.display="flex";
}

function saveCourse(){
 const grade=document.getElementById("grade").value;
 const hours=Number(document.getElementById("hours").value);

 if(!grade || !hours){
   alert("Please select grade and hours");
   return;
 }

 courses.push({grade,hours});
 localStorage.setItem("courses",JSON.stringify(courses));

 document.getElementById("grade").value="";
 document.getElementById("hours").value="";

 renderCourses();
}

function renderCourses(){
 const box=document.getElementById("courses");
 box.innerHTML="";
 courses.forEach((c,i)=>{
   box.innerHTML+=`
    <div class="course">
      ${c.grade} × ${c.hours} hours
      <button onclick="removeCourse(${i})">🗑</button>
    </div>`;
 });
}

function removeCourse(i){
 courses.splice(i,1);
 localStorage.setItem("courses",JSON.stringify(courses));
 renderCourses();
}

function calculateGPA(){
 if(!courses.length){
   alert("Add courses first");
   return;
 }

 let totalQualityPoints=0;
 let totalCreditHours=0;

 courses.forEach(course=>{
   totalQualityPoints += gradeScale[course.grade] * course.hours;
   totalCreditHours += course.hours;
 });

 let gpa = totalQualityPoints / totalCreditHours;
 gpa = Math.round(gpa * 100) / 100;

 const r=document.getElementById("result");
 r.style.display="block";
 r.className="result "+(gpa>=3?"good":gpa>=2?"mid":"bad");
 r.innerHTML=`GPA <span>${gpa.toFixed(2)}</span>`;
}

function resetAll(){
 courses=[];
 localStorage.removeItem("courses");
 document.getElementById("courses").innerHTML="";
 document.getElementById("inputs").style.display="none";
 document.getElementById("result").style.display="none";
}

function toggleDark(){
 document.body.classList.toggle("dark");
}

renderCourses();
</script>

</body>
</html>
