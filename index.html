<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
:root{
  --bg:#f3f4f6;
  --card:#ffffff;
  --blue:#4f8df5;
  --green:#2bbf5f;
  --dark:#0f172a;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  padding:120px 20px 40px;
  transition:.4s;
}

body.dark{
  background:#020617;
  color:white;
}

.card{
  max-width:900px;
  margin:auto;
  background:var(--card);
  padding:30px;
  border-radius:25px;
  box-shadow:0 20px 50px rgba(0,0,0,.1);
  transition:.4s;
}

body.dark .card{
  background:var(--dark);
}

h1{
  text-align:center;
  margin-bottom:30px;
}

/* ===== Buttons Style Like Image ===== */

.main-btn{
  width:100%;
  padding:22px;
  border:none;
  border-radius:25px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
  margin-bottom:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.save-btn{
  background:var(--blue);
  color:white;
}

.bottom-buttons{
  display:flex;
  gap:20px;
  margin-top:25px;
}

.add-btn{
  background:var(--green);
  color:white;
  flex:1;
}

.calc-btn{
  background:var(--blue);
  color:white;
  flex:1;
}

button:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 30px rgba(0,0,0,.15);
}

/* ===== Inputs ===== */

.inputs{
  display:flex;
  gap:15px;
  margin-bottom:20px;
}

select{
  flex:1;
  padding:15px;
  border-radius:15px;
  border:1px solid #ddd;
  font-size:16px;
}

/* ===== Courses List ===== */

.course-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  border-radius:20px;
  background:#e5e7eb;
  margin-bottom:15px;
  font-weight:bold;
}

body.dark .course-item{
  background:#1e293b;
}

.trash{
  background:#f1f1f1;
  width:55px;
  height:55px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:22px;
  transition:.3s;
}

.trash:hover{
  background:#ffdddd;
}

/* ===== Result ===== */

.result{
  text-align:center;
  font-size:28px;
  margin-top:20px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

<h1>🎓 GPA Calculator</h1>

<!-- Save Course -->
<button class="main-btn save-btn" onclick="saveCourse()">
  ✔ Save Course
</button>

<!-- Inputs -->
<div class="inputs">
  <select id="grade">
    <option value="">Select Grade</option>
    <option value="4">A</option>
    <option value="3.7">A-</option>
    <option value="3.3">B+</option>
    <option value="3">B</option>
    <option value="2.7">B-</option>
    <option value="2.3">C+</option>
    <option value="2">C</option>
    <option value="1.7">C-</option>
    <option value="1">D</option>
    <option value="0">F</option>
  </select>

  <select id="hours">
    <option value="">Hours</option>
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
    <option>5</option>
    <option>6</option>
  </select>
</div>

<!-- Courses List -->
<div id="courses"></div>

<!-- Bottom Buttons -->
<div class="bottom-buttons">
  <button class="main-btn add-btn" onclick="clearInputs()">
    ➕ Add Course
  </button>

  <button class="main-btn calc-btn" onclick="calculateGPA()">
    📊 Calculate
  </button>
</div>

<div class="result" id="result"></div>

</div>

<script>

let courses = [];

function saveCourse(){
  const grade=document.getElementById("grade").value;
  const hours=parseInt(document.getElementById("hours").value);

  if(!grade || !hours){
    alert("Please select grade and hours");
    return;
  }

  courses.push({grade,hours});
  renderCourses();
  clearInputs();
}

function clearInputs(){
  document.getElementById("grade").value="";
  document.getElementById("hours").value="";
}

function renderCourses(){
  const container=document.getElementById("courses");
  container.innerHTML="";
  courses.forEach((c,index)=>{
    container.innerHTML+=`
      <div class="course-item">
        ${c.grade} × ${c.hours} hours
        <div class="trash" onclick="removeCourse(${index})">🗑</div>
      </div>
    `;
  });
}

function removeCourse(index){
  courses.splice(index,1);
  renderCourses();
}

function calculateGPA(){
  if(!courses.length){
    alert("Add courses first");
    return;
  }

  let totalPoints=0;
  let totalHours=0;

  courses.forEach(c=>{
    totalPoints+=c.grade*c.hours;
    totalHours+=c.hours;
  });

  const gpa=(totalPoints/totalHours).toFixed(2);
  document.getElementById("result").innerHTML="GPA: "+gpa;
}

</script>

</body>
</html>
