<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#e5e7eb;
    text-align:center;
    transition:.3s;
}

.container{
    width:900px;
    margin:40px auto;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-bottom:60px;
}

.btn{
    padding:18px 40px;
    border:none;
    border-radius:40px;
    font-size:20px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    box-shadow:0 15px 30px rgba(0,0,0,.15);
    transition:.3s;
}

.dark-btn{background:#374151;}
.reset-btn{background:#ef4444;}
.add-btn{background:#22c55e;}
.save-btn{background:#3b82f6;}

.btn:hover{
    transform:translateY(-4px);
}

.calculate-btn{
    margin-top:80px;
    padding:28px 120px;
    font-size:30px;
    border:none;
    border-radius:60px;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#6366f1,#8b5cf6);
    box-shadow:0 20px 40px rgba(0,0,0,.2);
    transition:.3s;
}

.calculate-btn:hover{
    transform:scale(1.05);
}

.course{
    display:flex;
    gap:15px;
    margin-bottom:20px;
    justify-content:center;
}

input,select{
    padding:15px;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}

.result{
    margin-top:40px;
    font-size:40px;
    font-weight:bold;
}

/* Dark Mode */

.dark{
    background:#111827;
    color:white;
}

.dark input,.dark select{
    background:#374151;
    color:white;
    border:1px solid #555;
}

</style>
</head>
<body>

<div class="container">

<div class="buttons">
<button class="btn dark-btn" onclick="toggleDark()">🌙 Dark</button>
<button class="btn reset-btn" onclick="resetAll()">🔄 Reset</button>
<button class="btn add-btn" onclick="addCourse()">➕ Add</button>
<button class="btn save-btn">✔ Save</button>
</div>

<div id="courses"></div>

<button class="calculate-btn" onclick="calculateGPA()">📊 Calculate GPA</button>

<div class="result" id="result"></div>

</div>

<script>

/* Grade Scale EXACTLY like image */

const gradePoints = {
"A":4,
"A-":3.67,
"B+":3.33,
"B":3,
"B-":2.67,
"C+":2.33,
"C":2,
"C-":1.67,
"D":2,
"F":0
};

/* Add Course */

function addCourse(){
    let div=document.createElement("div");
    div.className="course";

    div.innerHTML=`
        <input type="text" placeholder="Course Name (Optional)">
        <select>
            <option>A</option>
            <option>A-</option>
            <option>B+</option>
            <option>B</option>
            <option>B-</option>
            <option>C+</option>
            <option>C</option>
            <option>C-</option>
            <option>D</option>
            <option>F</option>
        </select>
        <select>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
        </select>
    `;

    document.getElementById("courses").appendChild(div);
}

/* GPA Calculation EXACT formula */

function calculateGPA(){

    let courses=document.querySelectorAll(".course");
    let totalQualityPoints=0;
    let totalCreditHours=0;

    courses.forEach(course=>{
        let grade=course.querySelectorAll("select")[0].value;
        let credits=parseFloat(course.querySelectorAll("select")[1].value);

        let qualityPoints=gradePoints[grade]*credits;

        totalQualityPoints+=qualityPoints;
        totalCreditHours+=credits;
    });

    if(totalCreditHours===0){
        alert("Add courses first");
        return;
    }

    let gpa=totalQualityPoints/totalCreditHours;

    let finalLetter=getLetter(gpa);
    let color=getColor(gpa);

    let result=document.getElementById("result");
    result.innerHTML=`${finalLetter}`;
    result.style.color=color;
}

/* Letter From GPA */

function getLetter(gpa){
    if(gpa>=3.7) return "A";
    if(gpa>=3.33) return "B+";
    if(gpa>=3) return "B";
    if(gpa>=2.67) return "B-";
    if(gpa>=2.33) return "C+";
    if(gpa>=2) return "C";
    if(gpa>=1.67) return "C-";
    if(gpa>=1) return "D";
    return "F";
}

/* Color Based On GPA */

function getColor(gpa){
    if(gpa>=3.5) return "#16a34a";
    if(gpa>=3) return "#22c55e";
    if(gpa>=2) return "#f59e0b";
    return "#ef4444";
}

/* Reset */

function resetAll(){
    document.getElementById("courses").innerHTML="";
    document.getElementById("result").innerHTML="";
}

/* Dark Mode */

function toggleDark(){
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
